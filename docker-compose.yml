# Local development database. Neon hosts the cloud database (CLAUDE.md Section 12).
#
# The credentials below are for this local container only and are not secrets:
# the port is bound to 127.0.0.1, so nothing outside this machine can connect.
#
# Host port 15432, not 5432, so the container never collides with a native PostgreSQL
# install on the host (ADR 0005). Inside the container Postgres still listens on 5432.
name: trialpulse

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trialpulse
      POSTGRES_PASSWORD: trialpulse
      POSTGRES_DB: trialpulse
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialpulse -d trialpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
