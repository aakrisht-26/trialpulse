[project]
name = "trialpulse"
version = "0.1.0"
description = "Point-in-time early-stop risk estimates for open interventional trials on ClinicalTrials.gov."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aakrisht Yadav" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pydantic-settings[yaml]>=2.15.0",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs and design problems
    "UP",  # pyupgrade: modern syntax for the target version
    "SIM", # simplifications
    "C4",  # comprehensions
    "N",   # pep8 naming
    "PT",  # pytest style
    "PTH", # pathlib over os.path
    "RUF", # ruff-specific rules
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.coverage.run]
source = ["trialpulse"]
branch = true

[dependency-groups]
dev = [
    "lifelines>=0.30.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
]
