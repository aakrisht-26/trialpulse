[project]
name = "trialpulse"
version = "0.1.0"
description = "Point-in-time early-stop risk estimates for open interventional trials on ClinicalTrials.gov."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aakrisht Yadav" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "lifelines>=0.30.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.9",
    "mlflow-skinny>=3.17.0",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pandera[pandas]>=0.33.1",
    "psycopg[binary]>=3",
    "pyarrow>=25",
    "pydantic>=2.13.5",
    "pydantic-settings[yaml]>=2.15.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "threadpoolctl>=3.7.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs and design problems
    "UP",  # pyupgrade: modern syntax for the target version
    "SIM", # simplifications
    "C4",  # comprehensions
    "N",   # pep8 naming
    "PT",  # pytest style
    "PTH", # pathlib over os.path
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
# The repository's alembic/ folder holds migrations; the import name is the installed package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# scikit-learn, joblib, threadpoolctl, pandas, pyarrow and lifelines ship no type information
# (pandas-stubs would be a new dependency outside the locked stack).
[[tool.mypy.overrides]]
module = [
    "sklearn", "sklearn.*", "joblib", "threadpoolctl", "pandas", "pandas.*", "pyarrow", "pyarrow.*",
    "lifelines", "lifelines.*", "plotly", "plotly.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A default run skips the slow tests (worker pools, full app runs, real data) and takes
# about three minutes, half of it the leakage tests of the features. Run everything, as CI
# does, with: pytest -m "slow or not slow"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not slow",
]
markers = [
    "slow: worker pools, full app runs or real data; skipped by default, run in CI",
]

[tool.coverage.run]
source = ["trialpulse"]
branch = true

[dependency-groups]
# The API's runtime (Step 15): the Docker image installs this group only, so it carries no
# modeling or dataset package. A plain `uv sync` installs it too (default-groups).
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3",
    "pydantic>=2.13.5",
    "pydantic-settings[yaml]>=2.15.0",
    "sqlalchemy>=2",
]
# The dashboard's runtime (Step 16): it calls the API only, so it needs no database driver,
# model or dataset package. app/requirements.txt pins the same versions for Streamlit
# Community Cloud; tests/app/test_imports.py holds the pins to uv.lock.
dashboard = [
    "httpx>=0.28.1",
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
]
# The gated dataset's client (ADR 0040). A plain `uv sync` installs it, as it installs `dev`
# (see default-groups below), so nothing changes on the laptop or in CI; the live workflows
# install with --no-group dataset, so no runner that holds Neon's or MLflow's secrets can
# import it. tests/test_workflows.py holds this.
dataset = [
    "huggingface-hub>=1.32.0",
]
dev = [
    "mypy>=2.3.1",
    "playwright>=1.50",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[tool.uv]
default-groups = ["api", "dashboard", "dataset", "dev"]
