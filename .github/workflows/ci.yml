name: CI

on:
  push:
  pull_request:

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

# On other branches and pull requests, a newer commit cancels the older run on the
# same ref. On main, every run gets its own group (keyed by run id), so no run is
# ever cancelled or replaced and every main commit keeps its CI result.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.26"

      - name: Install dependencies from the lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q --cov --cov-report=term-missing
