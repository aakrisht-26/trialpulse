# Alembic migrations for the PostgreSQL schemas live, serving and monitoring (CLAUDE.md Step 3).
#
# The database URL is not stored here: alembic/env.py reads DATABASE_URL from the environment
# or .env (Section 17). Locally that is the Docker Compose Postgres on port 15432 (ADR 0005):
#   postgresql+psycopg://trialpulse:trialpulse@127.0.0.1:15432/trialpulse

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
