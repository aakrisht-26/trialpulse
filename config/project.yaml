# TrialPulse project configuration.
#
# Holds every tunable constant from CLAUDE.md Section 6. Code reads these values
# through trialpulse.config.load_project_config() and never hardcodes them.
# Environment variables cannot override this file. Changing a locked definition
# requires an ADR approved by Aakrisht.

dataset:
  repo_id: brbk/clinical_trials_history
  config_name: core
  revision: v2026.09.26   # Git tag of the pinned revision (v2026.MM.DD), set in Step 2
  cutoff: 2026-09-25     # max last_update_post_date in the pinned revision, recorded once computed

population:
  study_type: INTERVENTIONAL
  min_first_post_date: 2008-01-01   # time zero (t0) is study_first_post_date

# Overall-status groups, using canonical API v2 enum names.
statuses:
  open: [NOT_YET_RECRUITING, RECRUITING, ENROLLING_BY_INVITATION, ACTIVE_NOT_RECRUITING, SUSPENDED]
  early_stop: [TERMINATED, WITHDRAWN]   # event of interest
  competing: [COMPLETED]                # competing event
  unknown: [UNKNOWN]                    # the registry's computed label; see unknown_rule (ADR 0014)

# The registry's UNKNOWN rule, applied to versioned fields (ADR 0014): a state is lapsed
# on a date when its submitted status is one of these, its completion date has passed and
# its status verification is older than this many months.
unknown_rule:
  statuses: [NOT_YET_RECRUITING, RECRUITING, ENROLLING_BY_INVITATION, ACTIVE_NOT_RECRUITING]
  verification_lapse_months: 24

# Stop-reason groups for the cause-specific secondary targets.
stop_reasons:
  operational: [accrual, business, funding, administrative, covid19]
  scientific: [safety, efficacy]

landmarks:
  spacing_months: 6   # L_k = t0 + 6k months
  max_index: 6        # k = 0 to 6

horizons_months: [12, 24]

discrete_time:
  interval_months: 6   # four 6-month intervals after each landmark (j = 1 to 4)
  n_intervals: 4

walk_forward:
  eval_window_months: 12   # evaluation rows: T <= L < T + 12 months
  origins:
    - {date: 2016-01-01, role: dev}
    - {date: 2017-01-01, role: dev}
    - {date: 2018-01-01, role: test}     # locked test
    - {date: 2019-01-01, role: test}     # locked test
    - {date: 2020-01-01, role: stress}   # locked COVID stress test, reported separately

evaluation:
  bootstrap_resamples: 1000   # cluster bootstrap, resampling trials
  confidence_level: 0.95
  calibration_bins: 10        # risk deciles
  lift_top_fraction: 0.10     # lift at 10%
  # IPCW censoring weights (ADR 0017): one Kaplan-Meier censoring curve per lead sponsor
  # class at the landmark. A class with fewer rows than this among the evaluation rows of an
  # origin shares one pooled curve with the other small classes, at every landmark index.
  censoring_min_rows: 200

# Point-in-time features (CLAUDE.md Section 8).
features:
  recent_versions_months: 6     # "versions in the last 6 months"
  sponsor_prior_weight: 10      # empirical Bayes weight of the class rate in the sponsor's rate
  sponsor_alias_min_trials: 2   # trials a name must take over to count as a rename (ADR 0018)
  sponsor_alias_wait_days: 365  # and days since the first of them, before it counts (ADR 0018)
  text_components: 32           # dimensions kept per text field, fitted per origin
  text_hash_bits: 18            # the hashed vocabulary has 2^18 columns (ADR 0019)
  leakage_test_landmarks: 500   # landmarks sampled by the future-perturbation test

# Hyperparameter tuning (CLAUDE.md Section 9): a fixed budget of Optuna trials per model,
# on the development origins only. A trial is fitted on a seeded share of the training
# trials (all landmark rows of a drawn trial), so that tuning a model stays under an hour
# (one trial of M4 on a tenth of the trials of both development origins takes about a
# minute); the final fits use every row.
tuning:
  n_trials: 40
  trial_sample_share: 0.10

seeds:
  default: 42

# The live system (ADR 0045): run control, retention and the API v2 pull.
live:
  overlap_days: 3                # the pull starts at the stored watermark minus 3 days
  null_gate_share: 0.01          # stop before any write if one field turned NULL in more
                                 # than 1% of the overlap records that match a stored row
  max_missing_overlap: 5         # stored overlap rows the pull may miss before it fails
  full_run_days: 7               # a full run is due when the last one is this old
  lease_stale_minutes: 120       # a running job older than this is stale
  alarm_minutes: 60
  kill_minutes: 90
  recent_post_days: 185          # post dates kept on the wide row (the longest window is 184)
  page_size: 1000                # API v2 clamps larger values
  requests_per_minute: 40        # CLAUDE.md Section 7
  retention_alert_mb: [600, 700]
  retention_months: 12           # score history kept on Neon (ADR 0045)
  version_retention_months: 6    # live.study_versions kept on Neon (ADR 0069)
  keepalive_seconds: 60          # SELECT 1 on a held connection while a command works
                                 # (ADR 0072: Neon cuts a connection idle for 5 minutes)

# The read-only API (ADR 0049).
api:
  data_status_refresh_minutes: 15   # the data-as-of date is read from Neon at most this often
  connect_timeout_seconds: 15
  retry_wait_seconds: 2             # one retry for a compute that is waking up
  unavailable_retry_after_seconds: 30
  rate_limit_per_minute: 60         # per client address
  trusted_proxies: 1                # Render: measured on the deployed service (ADR 0065)
  cache_entries: 20000
  page_size_max: 200
